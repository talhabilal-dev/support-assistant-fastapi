[project]
name = "suppport-assistant"
version = "0.1.0"
description = "AI customer-support API: RAG chat assistant, tickets, and notifications"
readme = "README.md"
authors = [
    { name = "Talha Bilal", email = "m.talha.bilal.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.1",
    "resend>=2.49.1",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.48",
]

[project.scripts]
suppport-assistant = "suppport_assistant:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"scripts/eval/report.py" = ["E501"]  # long markdown table literals

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "pgvector.*",
    "resend.*",
    "slowapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SQLModel and pgvector stubs don't model Column attributes or nullable PK/FK ids precisely.
module = [
    "suppport_assistant.core.health",
    "suppport_assistant.modules.conversations.router",
    "suppport_assistant.modules.conversations.service",
    "suppport_assistant.modules.knowledge_base.service",
    "suppport_assistant.modules.tickets.service",
]
disable_error_code = ["arg-type", "attr-defined", "call-overload"]
